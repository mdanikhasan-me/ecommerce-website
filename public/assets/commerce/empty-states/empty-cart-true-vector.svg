<svg xmlns="http://www.w3.org/2000/svg"
  width="1024" height="1024" viewBox="0 0 130 130"
  fill="none" shape-rendering="geometricPrecision"
  role="img" aria-labelledby="title desc">
  <title id="title">Empty shopping cart</title>
  <desc id="desc">Sad shopping bag in a soft neutral circular badge. Transparent outside the badge.</desc>

  <!-- No background rectangle: everything outside this circle is transparent. -->
  <circle cx="65" cy="64.5" r="55" fill="#F6F2ED"/>

  <!-- Subtle notification rays -->
  <g stroke="#D7D2CB" stroke-width="2.2" stroke-linecap="round" opacity="0.82">
    <path d="M31.8 62.6L26.5 58.8"/>
    <path d="M30.1 69.7H24.7"/>
    <path d="M30.4 88.7L28.7 84.3"/>
    <path d="M98.2 62.6L103.5 58.8"/>
    <path d="M99.9 69.7H105.3"/>
    <path d="M99.6 88.7L101.3 84.3"/>
  </g>

  <!-- Ground line -->
  <path d="M24.5 95.6C44.2 93.1 85.8 98.1 105.5 95.6"
        stroke="#DDD8D1" stroke-width="2.55"
        stroke-linecap="round" opacity="0.70"/>

  <!-- Bag body -->
  <path d="M47.8 54.9H82.2
           C84.0 54.9 84.9 56.2 85.2 58.2
           L88.7 90.4
           C89.2 93.3 87.0 95.3 83.7 95.3
           H46.3
           C43.0 95.3 40.8 93.3 41.3 90.4
           L44.8 58.2
           C45.1 56.2 46.0 54.9 47.8 54.9Z"
        stroke="#616168" stroke-width="3.05"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Handles -->
  <path d="M54.5 63.7V51.2
           C54.5 42.4 59.0 36.4 65 36.4
           C71.0 36.4 75.5 42.4 75.5 51.2
           V63.7"
        stroke="#616168" stroke-width="3.05"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Face -->
  <circle cx="58.9" cy="69.3" r="1.75" fill="#616168"/>
  <circle cx="71.1" cy="69.3" r="1.75" fill="#616168"/>
  <path d="M59.2 79.8
           C60.9 76.7 62.9 75.3 65 75.3
           C67.1 75.3 69.1 76.7 70.8 79.8"
        stroke="#616168" stroke-width="2.5"
        stroke-linecap="round"/>
</svg>
