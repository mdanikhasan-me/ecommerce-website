# Local development PostgreSQL only.
# This file does not run Prisma migrations, seeds, db push, or app code.

services:
  boilabin-local-postgres:
    image: postgres:16-alpine
    container_name: boilabin-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - boilabin-local-postgres-data:/var/lib/postgresql/data
      - ./docker/local-postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  boilabin-local-postgres-data:
