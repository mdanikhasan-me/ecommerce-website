services:
  boilabin-local-postgres:
    image: postgres:16-alpine
    container_name: boilabin-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    volumes:
      - boilabin-local-postgres-data:/var/lib/postgresql/data
      - ./docker/local-postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  boilabin-local-postgres-data:
