name: Quality and security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: boilabin_ci
          POSTGRES_USER: boilabin
          POSTGRES_PASSWORD: boilabin_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boilabin -d boilabin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://boilabin:boilabin_ci_password@127.0.0.1:5432/boilabin_ci?schema=public
      AUTH_SECRET: ci-only-auth-secret-that-is-never-used
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: https://boilabin.com
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source and schema
        run: npm run check:static

      - name: Scan production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Apply migrations to disposable CI database
        run: npx prisma migrate deploy

      - name: Build production application
        run: npm run build
